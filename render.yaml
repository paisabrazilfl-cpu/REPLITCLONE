# render.yaml — Replit Clone on Render
# Docs: https://render.com/docs/yaml

services:
  - type: web
    name: replit-clone
    env: node
    region: oregon
    plan: free

    rootDir: ""

    buildCommand: |
      cd backend && npm install

    startCommand: |
      cp index.html backend/index.html
      cd backend && node server.js

    disk:
      name: replit-clone-data
      mountPath: /app/backend/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
