# render.yaml — Replit Clone on Render
# Docs: https://render.com/docs/yaml

services:
  - type: web
    name: replit-clone
    env: node
    region: oregon
    plan: free

    # Build and run from repo root so index.html and backend/ are siblings
    rootDir: ""

    buildCommand: |
      cd backend && npm install && npm rebuild better-sqlite3

    startCommand: |
      cp index.html backend/index.html
      cd backend && node server.js

    # Persist SQLite DB across deploys
    disk:
      name: replit-clone-data
      mountPath: /app/backend/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: WEB_CONCURRENCY
        value: 1
