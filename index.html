<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Replit Clone</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Courier New', monospace; background: #0e1117; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 44px; background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 15px; font-weight: 700; color: #f97316; letter-spacing: -0.5px; }
.project-name { font-size: 13px; color: #8b949e; background: #21262d; border: 1px solid #30363d; border-radius: 6px; padding: 3px 10px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.btn-run { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 5px 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.btn-run:hover { background: #2ea043; }
.btn-run.running { background: #da3633; }
.btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
.btn-secondary:hover { background: #30363d; }

.workspace { display: flex; flex: 1; overflow: hidden; }

.sidebar { width: 220px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 10px 12px; font-size: 11px; font-weight: 700; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
.new-file-btn { background: none; border: none; color: #58a6ff; cursor: pointer; font-size: 18px; line-height: 1; }
.file-tree { flex: 1; overflow-y: auto; padding: 6px 0; }
.file-item { display: flex; align-items: center; gap: 8px; padding: 5px 16px; cursor: pointer; font-size: 13px; color: #8b949e; border-left: 2px solid transparent; }
.file-item:hover { background: #21262d; color: #c9d1d9; }
.file-item.active { background: #1f6feb22; color: #58a6ff; border-left-color: #58a6ff; }
.file-icon { font-size: 14px; }

.editor-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; align-items: center; background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; overflow-x: auto; }
.tab { display: flex; align-items: center; gap: 6px; padding: 8px 16px; font-size: 12px; color: #8b949e; cursor: pointer; border-right: 1px solid #30363d; white-space: nowrap; border-bottom: 2px solid transparent; flex-shrink: 0; }
.tab:hover { color: #c9d1d9; background: #21262d; }
.tab.active { color: #c9d1d9; background: #0d1117; border-bottom-color: #f97316; }
.tab-close { margin-left: 4px; opacity: 0.5; font-size: 14px; }
.tab-close:hover { opacity: 1; }

.editor-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; }
.line-numbers { width: 48px; background: #0d1117; color: #484f58; font-size: 13px; line-height: 1.6; padding: 16px 8px; text-align: right; user-select: none; overflow: hidden; flex-shrink: 0; border-right: 1px solid #21262d; font-family: 'Courier New', monospace; }
.code-editor { flex: 1; background: #0d1117; color: #e2e8f0; border: none; outline: none; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.6; padding: 16px; resize: none; tab-size: 2; overflow-y: auto; caret-color: #f97316; }

.output-panel { height: 200px; border-top: 1px solid #30363d; display: flex; flex-direction: column; flex-shrink: 0; }
.output-tabs { display: flex; align-items: center; background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; }
.output-tab { padding: 6px 16px; font-size: 12px; color: #8b949e; cursor: pointer; border-bottom: 2px solid transparent; }
.output-tab.active { color: #c9d1d9; border-bottom-color: #f97316; }
.output-content { flex: 1; background: #0d1117; padding: 12px 16px; font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.6; overflow-y: auto; color: #3fb950; }
.output-content .err { color: #f85149; }
.output-content .info { color: #58a6ff; }
.output-content .warn { color: #d29922; }
.output-content .prompt { color: #8b949e; }

.status-bar { display: flex; align-items: center; justify-content: space-between; padding: 2px 12px; background: #f97316; font-size: 11px; color: #fff; flex-shrink: 0; }
.status-left { display: flex; gap: 16px; }
.status-right { display: flex; gap: 16px; }

.ai-panel { width: 0; background: #161b22; border-left: 1px solid #30363d; transition: width 0.2s; overflow: hidden; display: flex; flex-direction: column; }
.ai-panel.open { width: 280px; }
.ai-header { padding: 10px 12px; font-size: 11px; font-weight: 700; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #30363d; }
.ai-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.ai-msg { font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 6px; }
.ai-msg.user { background: #1f6feb33; color: #58a6ff; align-self: flex-end; max-width: 90%; }
.ai-msg.assistant { background: #21262d; color: #c9d1d9; align-self: flex-start; max-width: 90%; }
.ai-input-row { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid #30363d; }
.ai-input { flex: 1; background: #21262d; border: 1px solid #30363d; color: #e2e8f0; border-radius: 6px; padding: 6px 10px; font-size: 12px; outline: none; font-family: inherit; }
.ai-send { background: #f97316; border: none; color: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; font-weight: 600; }
.ai-send:disabled { opacity: 0.5; cursor: not-allowed; }

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.green { background: #3fb950; }
.dot.red { background: #f85149; }
.dot.yellow { background: #d29922; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="logo">◈ replit</span>
    <span class="project-name">my-project</span>
  </div>
  <div class="topbar-right">
    <button class="btn-secondary" id="aiToggle">✦ AI</button>
    <button class="btn-run" id="runBtn">▶ Run</button>
  </div>
</div>

<div class="workspace">
  <div class="sidebar">
    <div class="sidebar-header">
      Files
      <button class="new-file-btn" id="newFileBtn" title="New file">+</button>
    </div>
    <div class="file-tree" id="fileTree"></div>
  </div>

  <div class="editor-area">
    <div class="tabs" id="tabBar"></div>
    <div class="editor-wrapper">
      <div class="line-numbers" id="lineNumbers">1</div>
      <textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea>
    </div>
    <div class="output-panel">
      <div class="output-tabs">
        <div class="output-tab active" data-tab="console">Console</div>
        <div class="output-tab" data-tab="webview">Web View</div>
        <div class="output-tab" data-tab="shell">Shell</div>
      </div>
      <div class="output-content" id="outputContent"></div>
    </div>
  </div>

  <div class="ai-panel" id="aiPanel">
    <div class="ai-header">✦ AI Assistant</div>
    <div class="ai-messages" id="aiMessages">
      <div class="ai-msg assistant">Hi! I can help you write, debug, or explain code. Ask me anything about your project.</div>
    </div>
    <div class="ai-input-row">
      <input class="ai-input" id="aiInput" placeholder="Ask AI..." />
      <button class="ai-send" id="aiSend">→</button>
    </div>
  </div>
</div>

<div class="status-bar">
  <div class="status-left">
    <span><span class="dot green" id="statusDot"></span> Ready</span>
    <span id="statusLang">JavaScript</span>
  </div>
  <div class="status-right">
    <span id="cursorPos">Ln 1, Col 1</span>
    <span>UTF-8</span>
  </div>
</div>

<script>
const FILES = {
  'index.js': `// Welcome to Replit Clone!\n// JavaScript is ready to run.\n\nfunction greet(name) {\n  return \`Hello, \${name}! 👋\`;\n}\n\nconst users = ['Alice', 'Bob', 'Charlie'];\nusers.forEach(user => {\n  console.log(greet(user));\n});\n\nconsole.log('\\n--- Math Demo ---');\nconst fib = (n) => n <= 1 ? n : fib(n-1) + fib(n-2);\nfor (let i = 0; i <= 8; i++) {\n  console.log(\`fib(\${i}) = \${fib(i)}\`);\n}`,
  'index.html': `<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <title>My App</title>\n  <style>\n    body { font-family: sans-serif; background: #0e1117; color: #e2e8f0; padding: 2rem; }\n    h1 { color: #f97316; }\n    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin: 1rem 0; }\n  </style>\n</head>\n<body>\n  <h1>Hello, World!</h1>\n  <div class="card">\n    <p>Welcome to my web app.</p>\n  </div>\n</body>\n</html>`,
  'styles.css': `/* Styles */\nbody {\n  font-family: -apple-system, BlinkMacSystemFont, sans-serif;\n  background: #0e1117;\n  color: #e2e8f0;\n  margin: 0;\n  padding: 2rem;\n}\n\nh1 {\n  font-size: 2rem;\n  color: #f97316;\n  margin-bottom: 1rem;\n}\n\n.btn {\n  background: #f97316;\n  color: white;\n  border: none;\n  border-radius: 6px;\n  padding: 8px 16px;\n  cursor: pointer;\n}`,
  'README.md': `# Replit Clone\n\nA browser-based IDE built with vanilla HTML/CSS/JS + Claude AI.\n\n## Features\n- Multi-file editor with tabs\n- Live JS execution in the console\n- AI assistant powered by Claude API\n- File tree with new file creation\n- Line numbers, syntax-aware status bar\n\n## Stack\n- Vanilla HTML/CSS/JS (no frameworks)\n- Anthropic Claude API for AI chat\n\n## Usage\nOpen index.html in a browser. Click Run or press Ctrl+Enter to execute.\n`
};

const FILE_ICONS = { '.js':'🟨','.html':'🟧','.css':'🟦','.md':'📝','.py':'🐍','.json':'📋','.ts':'🔷',default:'📄' };
const FILE_LANGS = { '.js':'JavaScript','.html':'HTML','.css':'CSS','.md':'Markdown','.py':'Python','.json':'JSON','.ts':'TypeScript' };

let state = {
  files: {...FILES}, openTabs: ['index.js'], activeTab: 'index.js',
  editorContents: {...FILES}, isRunning: false, activeOutput: 'console', aiOpen: false
};

const editor = document.getElementById('codeEditor');
const lineNums = document.getElementById('lineNumbers');
const tabBar = document.getElementById('tabBar');
const fileTree = document.getElementById('fileTree');
const outputContent = document.getElementById('outputContent');
const runBtn = document.getElementById('runBtn');
const statusDot = document.getElementById('statusDot');
const statusLang = document.getElementById('statusLang');
const cursorPos = document.getElementById('cursorPos');

function getExt(name) { return name.includes('.') ? '.' + name.split('.').pop() : ''; }
function getIcon(name) { return FILE_ICONS[getExt(name)] || FILE_ICONS.default; }
function getLang(name) { return FILE_LANGS[getExt(name)] || 'Plain Text'; }

function renderFileTree() {
  fileTree.innerHTML = '';
  Object.keys(state.files).forEach(name => {
    const item = document.createElement('div');
    item.className = 'file-item' + (name === state.activeTab ? ' active' : '');
    item.innerHTML = `<span class="file-icon">${getIcon(name)}</span><span>${name}</span>`;
    item.onclick = () => openFile(name);
    fileTree.appendChild(item);
  });
}

function renderTabs() {
  tabBar.innerHTML = '';
  state.openTabs.forEach(name => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (name === state.activeTab ? ' active' : '');
    tab.innerHTML = `${getIcon(name)} ${name} <span class="tab-close" data-file="${name}">×</span>`;
    tab.onclick = (e) => {
      if (e.target.classList.contains('tab-close')) { closeTab(e.target.dataset.file); return; }
      openFile(name);
    };
    tabBar.appendChild(tab);
  });
}

function updateLineNumbers() {
  const lines = editor.value.split('\n').length;
  lineNums.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('\n');
  lineNums.scrollTop = editor.scrollTop;
}

function openFile(name) {
  state.editorContents[state.activeTab] = editor.value;
  state.activeTab = name;
  if (!state.openTabs.includes(name)) state.openTabs.push(name);
  editor.value = state.editorContents[name] || '';
  statusLang.textContent = getLang(name);
  updateLineNumbers();
  renderFileTree();
  renderTabs();
}

function closeTab(name) {
  state.editorContents[name] = editor.value;
  state.openTabs = state.openTabs.filter(t => t !== name);
  if (state.activeTab === name) {
    state.activeTab = state.openTabs[state.openTabs.length - 1] || Object.keys(state.files)[0];
    editor.value = state.editorContents[state.activeTab] || '';
    updateLineNumbers();
  }
  renderTabs(); renderFileTree();
}

function log(msg, type='') {
  const line = document.createElement('div');
  line.className = type;
  line.textContent = msg;
  outputContent.appendChild(line);
  outputContent.scrollTop = outputContent.scrollHeight;
}

function clearOutput() { outputContent.innerHTML = ''; }

function runCode() {
  state.editorContents[state.activeTab] = editor.value;
  const code = state.editorContents[state.activeTab];
  const name = state.activeTab;
  const ext = getExt(name);
  clearOutput();
  log(`$ run ${name}`, 'prompt');
  runBtn.textContent = '■ Stop';
  runBtn.classList.add('running');
  statusDot.className = 'dot yellow';
  setTimeout(() => {
    if (ext === '.js') {
      const origLog = console.log, origErr = console.error, origWarn = console.warn;
      const logs = [];
      console.log = (...a) => logs.push({type:'', msg: a.join(' ')});
      console.error = (...a) => logs.push({type:'err', msg: a.join(' ')});
      console.warn = (...a) => logs.push({type:'warn', msg: a.join(' ')});
      try { new Function(code)(); logs.forEach(l => log(l.msg, l.type)); log('\nProcess exited with code 0', 'info'); }
      catch(e) { logs.forEach(l => log(l.msg, l.type)); log('Error: ' + e.message, 'err'); log('\nProcess exited with code 1', 'err'); }
      console.log = origLog; console.error = origErr; console.warn = origWarn;
    } else if (ext === '.html') {
      log('[Web View] Open the Web View tab to preview HTML', 'info');
    } else if (ext === '.css') {
      const rules = (code.match(/\{[^}]*\}/g) || []).length;
      log(`Parsed ${rules} CSS rule(s)`, 'info');
    } else if (ext === '.md') {
      log(`Markdown: ${code.split('\n').length} lines, ${code.split(/\s+/).length} words`, 'info');
    } else {
      log(`No runner available for ${ext} files.`, 'warn');
    }
    runBtn.innerHTML = '▶ Run';
    runBtn.classList.remove('running');
    statusDot.className = 'dot green';
  }, 600);
}

runBtn.onclick = runCode;
editor.addEventListener('input', updateLineNumbers);
editor.addEventListener('scroll', () => { lineNums.scrollTop = editor.scrollTop; });
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, en = editor.selectionEnd;
    editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(en);
    editor.selectionStart = editor.selectionEnd = s + 2;
    updateLineNumbers();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCode(); }
});
editor.addEventListener('keyup', () => {
  const text = editor.value.substring(0, editor.selectionStart);
  const line = text.split('\n').length;
  const col = text.split('\n').pop().length + 1;
  cursorPos.textContent = `Ln ${line}, Col ${col}`;
});

document.getElementById('newFileBtn').onclick = () => {
  const name = prompt('File name:');
  if (!name) return;
  state.files[name] = '';
  state.editorContents[name] = '';
  openFile(name);
};

document.querySelectorAll('.output-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    clearOutput();
    if (tab.dataset.tab === 'shell') log('Shell: sandboxed JS environment only.', 'info');
    else if (tab.dataset.tab === 'webview') log('[Web View] Run an HTML file to preview.', 'info');
  };
});

document.getElementById('aiToggle').onclick = () => {
  state.aiOpen = !state.aiOpen;
  document.getElementById('aiPanel').classList.toggle('open', state.aiOpen);
};

const aiInput = document.getElementById('aiInput');
const aiSend = document.getElementById('aiSend');
const aiMessages = document.getElementById('aiMessages');

async function sendAiMessage() {
  const msg = aiInput.value.trim();
  if (!msg) return;
  aiInput.value = '';
  aiSend.disabled = true;
  const userDiv = document.createElement('div');
  userDiv.className = 'ai-msg user';
  userDiv.textContent = msg;
  aiMessages.appendChild(userDiv);
  const thinkDiv = document.createElement('div');
  thinkDiv.className = 'ai-msg assistant';
  thinkDiv.textContent = '...';
  aiMessages.appendChild(thinkDiv);
  aiMessages.scrollTop = aiMessages.scrollHeight;
  const currentCode = state.editorContents[state.activeTab] || editor.value;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 1000,
        system: `You are an AI coding assistant in a Replit-like IDE. User is editing "${state.activeTab}". Current code:\n\`\`\`\n${currentCode.substring(0,1500)}\n\`\`\`\nBe concise. Under 150 words.`,
        messages: [{ role: 'user', content: msg }]
      })
    });
    const data = await res.json();
    thinkDiv.textContent = data.content?.find(b => b.type === 'text')?.text || 'No response.';
  } catch(e) {
    thinkDiv.textContent = 'Error connecting to AI.';
    thinkDiv.style.color = '#f85149';
  }
  aiSend.disabled = false;
  aiMessages.scrollTop = aiMessages.scrollHeight;
}

aiSend.onclick = sendAiMessage;
aiInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendAiMessage(); });

openFile('index.js');
log('Welcome to Replit Clone! Press ▶ Run or Ctrl+Enter to execute.', 'info');
</script>
</body>
</html>
