<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Replit Clone v3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Courier New',monospace;background:#0e1117;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:44px;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0}
.logo{font-size:15px;font-weight:700;color:#f97316;letter-spacing:-0.5px}
.project-name{font-size:13px;color:#8b949e;background:#21262d;border:1px solid #30363d;border-radius:6px;padding:3px 10px}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn-run{background:#238636;color:#fff;border:none;border-radius:6px;padding:5px 16px;font-size:13px;font-weight:600;cursor:pointer}
.btn-run:hover{background:#2ea043}
.btn-run.running{background:#da3633}
.btn-secondary{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn-secondary:hover{background:#30363d}
.lang-select{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;outline:none}
.workspace{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:8px 12px;font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
.icon-btn{background:none;border:none;color:#58a6ff;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px}
.icon-btn:hover{background:#21262d}
.file-tree{flex:1;overflow-y:auto;padding:4px 0}
.file-item{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;font-size:13px;color:#8b949e;border-left:2px solid transparent}
.file-item:hover{background:#21262d;color:#c9d1d9}
.file-item.active{background:#1f6feb22;color:#58a6ff;border-left-color:#58a6ff}
.file-delete{margin-left:auto;opacity:0;font-size:12px;color:#f85149;padding:0 4px}
.file-item:hover .file-delete{opacity:1}
.pkg-section{border-top:1px solid #30363d;padding:8px 12px;flex-shrink:0}
.pkg-header{font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.pkg-badge{font-size:9px;background:#1f6feb;color:#fff;border-radius:3px;padding:1px 5px;font-weight:normal;text-transform:none;letter-spacing:0}
.pkg-input-row{display:flex;gap:4px}
.pkg-input{flex:1;background:#21262d;border:1px solid #30363d;color:#e2e8f0;border-radius:4px;padding:4px 6px;font-size:11px;outline:none;font-family:inherit}
.pkg-btn{background:#1f6feb;border:none;color:#fff;border-radius:4px;padding:4px 8px;font-size:11px;cursor:pointer;font-weight:700}
.pkg-list{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;max-height:80px;overflow-y:auto}
.pkg-tag{font-size:11px;color:#58a6ff;background:#1f6feb22;padding:2px 8px;border-radius:10px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.pkg-remove{color:#f85149;cursor:pointer;font-size:12px;line-height:1}
.editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;align-items:center;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;padding:7px 14px;font-size:12px;color:#8b949e;cursor:pointer;border-right:1px solid #30363d;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.tab:hover{color:#c9d1d9;background:#21262d}
.tab.active{color:#c9d1d9;background:#0d1117;border-bottom-color:#f97316}
.tab-close{margin-left:4px;opacity:0.4;font-size:14px}
.tab-close:hover{opacity:1}
.editor-wrapper{flex:1;display:flex;overflow:hidden}
.line-numbers{width:48px;background:#0d1117;color:#484f58;font-size:13px;line-height:1.6;padding:16px 8px;text-align:right;user-select:none;overflow:hidden;flex-shrink:0;border-right:1px solid #21262d;font-family:'Courier New',monospace}
.code-editor{flex:1;background:#0d1117;color:#e2e8f0;border:none;outline:none;font-family:'Courier New',monospace;font-size:13px;line-height:1.6;padding:16px;resize:none;tab-size:2;overflow-y:auto;caret-color:#f97316}
.output-panel{height:220px;border-top:1px solid #30363d;display:flex;flex-direction:column;flex-shrink:0}
.output-tabs{display:flex;align-items:center;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;gap:0}
.output-tab{padding:6px 14px;font-size:12px;color:#8b949e;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.output-tab.active{color:#c9d1d9;border-bottom-color:#f97316}
.out-pane{flex:1;overflow-y:auto;display:none}
.out-pane.active{display:flex;flex-direction:column}
.console-out{background:#0d1117;padding:10px 14px;font-family:'Courier New',monospace;font-size:12px;line-height:1.6;flex:1;overflow-y:auto;color:#3fb950}
.console-out .err{color:#f85149}
.console-out .info{color:#58a6ff}
.console-out .warn{color:#d29922}
.console-out .prompt{color:#8b949e}
.console-out .sys{color:#a371f7}
.terminal-wrap{background:#0d1117;flex:1;display:flex;flex-direction:column;overflow:hidden}
.terminal-out{flex:1;padding:10px 14px;font-family:'Courier New',monospace;font-size:12px;line-height:1.6;overflow-y:auto;color:#e2e8f0}
.terminal-row{display:flex;align-items:center;padding:5px 14px;border-top:1px solid #21262d;gap:6px;flex-shrink:0}
.t-prompt{color:#3fb950;font-size:12px;white-space:nowrap}
.t-input{flex:1;background:transparent;border:none;outline:none;color:#e2e8f0;font-family:'Courier New',monospace;font-size:12px}
.webview-wrap{flex:1;background:#fff;overflow:hidden}
.webview-wrap iframe{width:100%;height:100%;border:none}
.ai-panel{width:0;background:#161b22;border-left:1px solid #30363d;transition:width 0.2s;overflow:hidden;display:flex;flex-direction:column}
.ai-panel.open{width:280px}
.ai-header{padding:10px 12px;font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
.ai-clear{font-size:11px;color:#8b949e;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:normal;padding:2px 6px;border-radius:3px}
.ai-clear:hover{background:#21262d;color:#c9d1d9}
.ai-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.ai-msg{font-size:12px;line-height:1.5;padding:8px 10px;border-radius:6px;white-space:pre-wrap;word-break:break-word}
.ai-msg.user{background:#1f6feb33;color:#58a6ff;align-self:flex-end;max-width:92%}
.ai-msg.bot{background:#21262d;color:#c9d1d9;align-self:flex-start;max-width:92%}
.ai-row{display:flex;gap:6px;padding:10px 12px;border-top:1px solid #30363d}
.ai-in{flex:1;background:#21262d;border:1px solid #30363d;color:#e2e8f0;border-radius:6px;padding:6px 10px;font-size:12px;outline:none;font-family:inherit}
.ai-go{background:#f97316;border:none;color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:700}
.ai-go:disabled{opacity:0.4;cursor:not-allowed}
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:2px 12px;background:#f97316;font-size:11px;color:#fff;flex-shrink:0}
.sl,.sr{display:flex;gap:14px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.dot.g{background:#3fb950}.dot.y{background:#d29922;animation:p 1s infinite}.dot.r{background:#f85149}
@keyframes p{0%,100%{opacity:1}50%{opacity:0.3}}
.sbadge{font-size:10px;background:#ffffff33;border-radius:3px;padding:1px 5px}
.modal-bg{display:none;position:fixed;inset:0;background:#000000aa;z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;width:340px}
.modal h3{color:#e2e8f0;font-size:14px;margin-bottom:12px}
.modal input{width:100%;background:#21262d;border:1px solid #30363d;color:#e2e8f0;border-radius:6px;padding:7px 10px;font-size:13px;outline:none;font-family:inherit;margin-bottom:10px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.mbtn{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:5px 14px;font-size:12px;cursor:pointer}
.mbtn.ok{background:#238636;border-color:#238636;color:#fff}
.pyodide-status{font-size:10px;padding:2px 6px;border-radius:3px;background:#21262d;color:#8b949e}
.pyodide-status.ready{color:#3fb950}
.pyodide-status.loading{color:#d29922}
</style>

    if n <= 1 { return n }
    return fib(n-1) + fib(n-2)

}`,

// ─── STATE ───────────────────────────────────────────────────────────────────
let S = {
  files: {}, tabs: [], active: '', contents: {},
  packages: [], lang: 'javascript', aiOpen: false,
  termHistory: [], termIdx: -1
};

// ─── PYODIDE ─────────────────────────────────────────────────────────────────
let pyodide = null;
let pyodideLoading = false;
let pyodideReady = false;

async function loadPyodide() {
  if (pyodideReady || pyodideLoading) return;
  pyodideLoading = true;
  try {
    const script = document.createElement('script');
    script.src = PYODIDE_URL;
    document.head.appendChild(script);
    await new Promise((resolve, reject) => {
      script.onload = resolve;
      script.onerror = () => reject(new Error('Failed to load Pyodide script'));
    });
    pyodide = await window.loadPyodide();
    await pyodide.loadPackage('micropip');
    pyodideReady = true;
    document.getElementById('pyStatus').textContent = 'Python: ready';
    document.getElementById('pyStatus').className = 'pyodide-status ready';
  } catch(e) {
    document.getElementById('pyStatus').textContent = 'Python: failed';
    document.getElementById('pyStatus').className = 'pyodide-status';
  }
  pyodideLoading = false;
}

// Start loading Pyodide immediately in background
loadPyodide();

function persist() {
  S.contents[S.active] = ed.value;
  try {
    localStorage.setItem('rc3_c', JSON.stringify(S.contents));
    localStorage.setItem('rc3_p', JSON.stringify(S.packages));

    localStorage.setItem('rc3_t', JSON.stringify(S.tabs));
    localStorage.setItem('rc3_a', S.active);
    badge('Saved');

}

function hydrate() {
  try {
    const c = localStorage.getItem('rc3_c');
    const p = localStorage.getItem('rc3_p');
    const l = localStorage.getItem('rc3_l');
    const t = localStorage.getItem('rc3_t');
    const a = localStorage.getItem('rc3_a');
    if (c) S.contents = JSON.parse(c);
    if (p) S.packages = JSON.parse(p);
    if (l) S.lang = l;
    if (t) S.tabs = JSON.parse(t);
    if (a) S.active = a;
    S.files = Object.fromEntries(Object.keys(S.contents).map(k => [k, 1]));
    return Object.keys(S.files).length > 0;
  } catch(e) { return false; }
}

// ─── FILE TREE ───────────────────────────────────────────────────────────────
function renderTree() {
  fileTree.innerHTML = '';
  Object.keys(S.files).forEach(name => {
    const d = document.createElement('div');
    d.className = 'file-item' + (name === S.active ? ' active' : '');
    d.innerHTML = `<span style="font-size:9px;background:#21262d;padding:1px 4px;border-radius:2px;color:#8b949e;flex-shrink:0">${icon(name)}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span><span class="file-delete" data-f="${name}">x</span>`;
    d.onclick = e => {
      if (e.target.dataset.f) { delFile(e.target.dataset.f); return; }
      openFile(name);
    };
    fileTree.appendChild(d);
  });
}

function renderTabs() {
  tabBar.innerHTML = '';
  S.tabs.forEach(name => {
    const t = document.createElement('div');
    t.className = 'tab' + (name === S.active ? ' active' : '');
    t.innerHTML = `${icon(name)} ${name} <span class="tab-close" data-f="${name}">x</span>`;
    t.onclick = e => {
      if (e.target.classList.contains('tab-close')) { closeTab(e.target.dataset.f); return; }
      openFile(name);
    };
    tabBar.appendChild(t);
  });
}

function updateLines() {
  const n = ed.value.split('\n').length;
  lineNums.innerHTML = Array.from({length:n},(_,i)=>i+1).join('\n');
  lineNums.scrollTop = ed.scrollTop;
  document.getElementById('sChars').textContent = ed.value.length + ' chars';
}

function openFile(name) {
  if (S.active) S.contents[S.active] = ed.value;
  S.active = name;
  if (!S.tabs.includes(name)) S.tabs.push(name);
  ed.value = S.contents[name] || '';
  updateLines();
  renderTree();
  renderTabs();
}

function closeTab(name) {
  if (S.active === name) S.contents[name] = ed.value;
  S.tabs = S.tabs.filter(t => t !== name);
  if (S.active === name) {
    S.active = S.tabs[S.tabs.length-1] || '';
    ed.value = S.active ? (S.contents[S.active]||'') : '';
    updateLines();
  }
  renderTabs(); renderTree();
}

function delFile(name) {
  if (!confirm('Delete ' + name + '?')) return;
  delete S.files[name];
  delete S.contents[name];
  closeTab(name);
  renderTree();
  persist();
}

function makeFile(name) {
  if (!name) return;
  S.files[name] = 1;
  S.contents[name] = STARTERS[S.lang] || '';
  openFile(name);
  persist();
}

// ─── JAVASCRIPT EXECUTION via real Node (Piston) + npm (esm.sh) ──────────────
async function runJS(code) {
  // Rewrite npm imports to esm.sh for browser module execution
  // But for Piston (Node), just run as-is
  const pkgNames = S.packages.map(p => p.name);
  
  // Prepend require stubs that will work in Node via Piston
  // Piston's Node has many built-ins but not npm packages
  // For real npm packages, we run in a sandboxed iframe using ES modules + esm.sh
  
  const hasImports = /^import\s+/m.test(code) || /require\s*\(/.test(code);
  
  if (S.packages.length > 0 || hasImports) {
    // Run in iframe sandbox with esm.sh for real npm packages
    await runJSInBrowser(code);
  } else {
    // Pure JS — run via Piston (Node.js)
    await runViaPiston('javascript', code, LF.javascript);
  }
}

async function runJSInBrowser(code) {
  clog('Running in browser sandbox (esm.sh for npm packages)...', 'sys');
  
  // Rewrite import statements and require() to esm.sh URLs
  let transformed = code
    .replace(/^import\s+(.+?)\s+from\s+['"](?!https?:\/\/|\.\/|\.\.\/|\/)(.*?)['"]/gm,
      (_, imp, pkg) => `import ${imp} from '${ESM}${pkg}'`)
    .replace(/require\s*\(\s*['"](?!https?:\/\/|\.\/|\.\.\/|\/)([^'"]+)['"]\s*\)/g,
      (_, pkg) => `(await import('${ESM}${pkg}')).default || (await import('${ESM}${pkg}'))`);

  // Add package imports from sidebar
  const pkgImports = S.packages.map(p =>
    `const ${p.alias} = (await import('${ESM}${p.name}')).default || await import('${ESM}${p.name}');`
  ).join('\n');

  const logs = [];
  const sandbox = document.getElementById('jsSandbox');

  return new Promise(resolve => {
    const msgId = 'exec_' + Date.now();

    const listener = e => {
      if (!e.data || e.data.id !== msgId) return;
      window.removeEventListener('message', listener);
      e.data.logs.forEach(l => clog(l.msg, l.type));
      if (e.data.error) clog('Error: ' + e.data.error, 'err');
      clog('\nBrowser execution complete.', 'info');
      resolve();
    };
    window.addEventListener('message', listener);

    const src = `
<!DOCTYPE html><html><body><script type="module">
const logs = [];
const wrap = (type) => (...args) => {
  logs.push({type, msg: args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ')});
};
const _log = wrap(''), _err = wrap('err'), _warn = wrap('warn'), _info = wrap('info');
const console = {log:_log, error:_err, warn:_warn, info:_info, dir:_log, table:_log};
try {
  ${pkgImports}
  ${transformed}
  parent.postMessage({id:'${msgId}', logs, error:null}, '*');
} catch(e) {
  parent.postMessage({id:'${msgId}', logs, error: e.message}, '*');
}
<\/script></body></html>`;

    sandbox.srcdoc = src;
    setTimeout(() => {
      window.removeEventListener('message', listener);
      clog('Timeout (10s). Long-running code may need Piston.', 'warn');
      resolve();
    }, 10000);
  });
}

// ─── PYTHON EXECUTION via Pyodide + micropip ──────────────────────────────────
async function runPython(code) {
  if (!pyodideReady) {
    if (!pyodideLoading) loadPyodide();
    clog('Pyodide loading... please wait a moment and try again.', 'warn');
    clog('(Python runs fully in your browser via WebAssembly)', 'info');
    return;
  }

  clog('Python 3 (Pyodide + WebAssembly)...', 'sys');

  // Auto-install packages from sidebar
  if (S.packages.length > 0) {
    const pyPkgs = S.packages.map(p => p.name);
    clog('Installing: ' + pyPkgs.join(', '), 'info');
    try {
      const micropip = pyodide.pyimport('micropip');
      for (const pkg of pyPkgs) {
        try {
          await micropip.install(pkg);
          clog('  installed: ' + pkg, 'info');
        } catch(e) {
          clog('  failed: ' + pkg + ' — ' + e.message, 'warn');
        }
      }
    } catch(e) {
      clog('micropip error: ' + e.message, 'warn');
    }
  }

  // Also detect imports in code and try to install them
  const importRe = /^(?:import|from)\s+(\w+)/gm;
  const builtins = new Set(['sys','os','math','json','re','datetime','time','random','collections','itertools','functools','pathlib','io','abc','typing','enum','dataclasses','copy','pprint','string','struct','pickle','csv','hashlib','hmac','base64','urllib','http','email','html','xml','sqlite3','threading','multiprocessing','subprocess','shutil','tempfile','glob','fnmatch','logging','unittest','traceback','gc','inspect','dis','ast','builtins','__future__']);
  const detectedImports = [];
  let m;
  while ((m = importRe.exec(code)) !== null) {
    const pkg = m[1];
    if (!builtins.has(pkg) && !detectedImports.includes(pkg)) {
      detectedImports.push(pkg);
    }
  }

  if (detectedImports.length > 0) {
    const micropip = pyodide.pyimport('micropip');
    for (const pkg of detectedImports) {
      try {
        await pyodide.loadPackage(pkg);
      } catch(e) {
        try {
          await micropip.install(pkg);
          clog('  auto-installed: ' + pkg, 'info');
        } catch(e2) { /* package may already be available or unavailable */ }
      }
    }
  }

  // Capture stdout/stderr
  let stdout = '';
  let stderr = '';
  pyodide.setStdout({ batched: s => { stdout += s + '\n'; }});
  pyodide.setStderr({ batched: s => { stderr += s + '\n'; }});

  try {
    await pyodide.runPythonAsync(code);
    if (stdout) stdout.trimEnd().split('\n').forEach(l => clog(l));
    if (stderr) stderr.trimEnd().split('\n').filter(l=>l).forEach(l => clog(l, 'warn'));
    clog('\nProcess exited with code 0', 'info');
  } catch(e) {
    if (stdout) stdout.trimEnd().split('\n').forEach(l => clog(l));
    clog(e.message, 'err');
    clog('\nProcess exited with code 1', 'err');
  }
}

// ─── PISTON API (compiled/server langs) ──────────────────────────────────────
async function runViaPiston(lang, code, filename) {
  clog(`Running via Piston API [${LD[lang]}]...`, 'sys');
  try {
    const res = await fetch(PISTON, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({language:lang, version:LV[lang], files:[{name:filename, content:code}]})
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const r = data.run;
    if (r.stdout) r.stdout.split('\n').forEach(l => clog(l));
    if (r.stderr) r.stderr.split('\n').filter(l=>l).forEach(l => clog(l, r.code===0?'warn':'err'));
    clog(`\nExited with code ${r.code}`, r.code===0?'info':'err');
    setStatus(r.code===0?'Done':'Error', r.code===0?'g':'r');
  } catch(e) {
    clog('Piston API error: ' + e.message, 'err');
    clog('Check your internet connection.', 'warn');
    setStatus('Error', 'r');
  }
}

// ─── MAIN RUN ─────────────────────────────────────────────────────────────────
async function runCode() {
  S.contents[S.active] = ed.value;
  const code = ed.value;
  const lang = S.lang;
  clearConsole();
  clog(`$ run ${S.active || LF[lang]} [${LD[lang]}]`, 'prompt');
  runBtn.textContent = 'Stop'; runBtn.classList.add('running');
  setStatus('Running...', 'y');

  try {
    if (lang === 'javascript') {
      await runJS(code);
    } else if (lang === 'python') {
      await runPython(code);
    } else if (lang === 'html') {
      previewHTML(code);
    } else {
      await runViaPiston(lang, code, LF[lang]);
    }
  } catch(e) {
    clog('Unexpected error: ' + e.message, 'err');
    setStatus('Error', 'r');
  }

  runBtn.innerHTML = '&#9654; Run'; runBtn.classList.remove('running');
  if (sDot.className.includes('y')) setStatus('Done', 'g');
}

// ─── TERMINAL ─────────────────────────────────────────────────────────────────
async function runTerm(cmd) {
  if (!cmd.trim()) return;
  S.termHistory.unshift(cmd); S.termIdx = -1;
  const d = document.createElement('div');
  d.style.color = '#8b949e'; d.textContent = '$ ' + cmd;
  termOut.appendChild(d);

  if (cmd === 'clear' || cmd === 'cls') { termOut.innerHTML = ''; return; }
  if (cmd === 'help') {
    tprint('Commands run via Piston bash API. Examples:', '#58a6ff');
    tprint('  ls, pwd, echo, python3 -c "print(1+1)", node -e "console.log(2**10)"', '#8b949e');
    return;
  }
  if (cmd.startsWith('cd ')) { tprint('Note: directory state does not persist between commands', '#d29922'); return; }

  try {
    const res = await fetch(PISTON, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({language:'bash', version:'5.2.0', files:[{name:'cmd.sh', content:'#!/bin/bash\n'+cmd}]})
    });
    const data = await res.json();
    if (data.run.stdout) data.run.stdout.split('\n').forEach(l => tprint(l));
    if (data.run.stderr) data.run.stderr.split('\n').filter(l=>l).forEach(l => tprint(l,'#f85149'));
    if (!data.run.stdout && !data.run.stderr) tprint('(no output)', '#8b949e');
  } catch(e) { tprint('Error: '+e.message,'#f85149'); }
}

function tprint(msg, color='') {
  const d = document.createElement('div');
  if (color) d.style.color = color;
  d.textContent = msg;
  termOut.appendChild(d);
  termOut.scrollTop = termOut.scrollHeight;
}

const termIn = document.getElementById('termIn');
termIn.addEventListener('keydown', async e => {
  if (e.key === 'Enter') { const cmd = termIn.value; termIn.value = ''; await runTerm(cmd); }
  else if (e.key === 'ArrowUp') { S.termIdx = Math.min(S.termIdx+1, S.termHistory.length-1); termIn.value = S.termHistory[S.termIdx]||''; }
  else if (e.key === 'ArrowDown') { S.termIdx = Math.max(S.termIdx-1,-1); termIn.value = S.termIdx===-1?'':S.termHistory[S.termIdx]; }
});

const aiIn = document.getElementById('aiIn');
const aiGo = document.getElementById('aiGo');
const aiMsgs = document.getElementById('aiMsgs');

async function askAI() {
  const msg = aiIn.value.trim(); if (!msg) return;
  aiIn.value = ''; aiGo.disabled = true;
  const ud = document.createElement('div'); ud.className='ai-msg user'; ud.textContent=msg; aiMsgs.appendChild(ud);
  const bd = document.createElement('div'); bd.className='ai-msg bot'; bd.textContent='...'; aiMsgs.appendChild(bd);
  aiMsgs.scrollTop = aiMsgs.scrollHeight;
  const code = (S.contents[S.active]||ed.value).substring(0,2500);
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:1000,
        system:`You are an AI coding assistant in a browser IDE. File: "${S.active}", Language: ${LD[S.lang]}.\nCode:\n\`\`\`\n${code}\n\`\`\`\nBe concise (under 200 words). Use code blocks when showing code.`,
        messages:[{role:'user',content:msg}]
      })
    });
    const data = await res.json();
    bd.textContent = data.content?.find(b=>b.type==='text')?.text || 'No response.';
  } catch(e) { bd.textContent='AI error: '+e.message; bd.style.color='#f85149'; }
  aiGo.disabled=false; aiMsgs.scrollTop=aiMsgs.scrollHeight;
}
aiGo.onclick = askAI;
aiIn.addEventListener('keydown', e => { if(e.key==='Enter') askAI(); });

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  const loaded = hydrate();
  langSel.value = S.lang;
  sLang.textContent = LD[S.lang];

  if (!loaded || Object.keys(S.files).length === 0) {
    const fn = LF[S.lang];
    S.files[fn] = 1;
    S.contents[fn] = STARTERS[S.lang];
    S.tabs = [fn]; S.active = fn;
  }
  if (!S.files[S.active]) {
    S.active = Object.keys(S.files)[0]||'';
    if (!S.tabs.includes(S.active)) S.tabs = [S.active];
  }
  ed.value = S.contents[S.active]||'';
  renderTree(); renderTabs(); updateLines(); renderPkgs();

  clog('Replit Clone v3 — FULLY FUNCTIONAL', 'sys');
  clog('JavaScript: real Node.js (Piston) + any npm package (esm.sh)', 'info');
  clog('Python: runs IN YOUR BROWSER via Pyodide + micropip (any PyPI package)', 'info');
  clog('Bash/C++/Java/Rust/Go/Ruby: real execution via Piston API', 'info');
  clog('Files auto-save to localStorage. Ctrl+Enter to run. Ctrl+S to save.', 'info');
  clog('─────────────────────────────────────────────────────────────', 'prompt');
}
